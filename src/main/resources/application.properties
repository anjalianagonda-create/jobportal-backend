spring.application.name=jobportal
server.port=8080

# ---------- MySQL (override with environment variables) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jobportal}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# The secret must be at least 32 characters. Always set JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-min-32-chars}
app.jwt.expiration-hours=24

# ---------- CORS (comma separated list of frontend origins) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Bootstrap data ----------
app.admin.name=System Administrator
app.admin.email=${ADMIN_EMAIL:admin@jobportal.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed-demo-data=${SEED_DEMO_DATA:true}
